name: solver-image

# Builds the Quantum ESPRESSO solver image natively per platform and publishes
# it to GHCR with the workflow's GITHUB_TOKEN (no personal token needed).
# Each platform is pushed as a plain OCI image manifest; its digest is what a
# signed solver manifest pins (spec §7.7). Signing happens offline, never in CI.

on:
  workflow_dispatch:
    inputs:
      qe_version:
        description: Quantum ESPRESSO version
        default: "7.4.1"
  push:
    tags: ["solver-qe-*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pumat-quantum-espresso
  QE_VERSION: ${{ inputs.qe_version || '7.4.1' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      digest-amd64: ${{ steps.push.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.push.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push linux/${{ matrix.arch }}
        id: push
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker buildx build solvers/quantum-espresso \
            -f solvers/quantum-espresso/Containerfile \
            --platform linux/${{ matrix.arch }} \
            --build-arg QE_VERSION=$QE_VERSION \
            --provenance=false --sbom=false \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --tag "$IMAGE_LC:$QE_VERSION-${{ matrix.arch }}" \
            --metadata-file meta.json --push
          digest=$(jq -r '."containerimage.digest"' meta.json)
          echo "digest-${{ matrix.arch }}=$digest" >> "$GITHUB_OUTPUT"
          echo "linux/${{ matrix.arch }}: $IMAGE_LC@$digest" >> "$GITHUB_STEP_SUMMARY"

  index:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: multi-platform index
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create -t "$IMAGE_LC:$QE_VERSION" \
            "$IMAGE_LC@${{ needs.build.outputs.digest-amd64 }}" \
            "$IMAGE_LC@${{ needs.build.outputs.digest-arm64 }}"
          index=$(docker buildx imagetools inspect "$IMAGE_LC:$QE_VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          cat > digests.json <<EOF
          {"image": "$IMAGE_LC", "qe_version": "$QE_VERSION", "commit": "${{ github.sha }}",
           "linux/amd64": "${{ needs.build.outputs.digest-amd64 }}",
           "linux/arm64": "${{ needs.build.outputs.digest-arm64 }}",
           "index": "$index"}
          EOF
          cat digests.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: solver-digests
          path: digests.json
